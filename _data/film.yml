# Photographs hung on the "Film Photography" wall of the about page, left to right.
# To change them: put the photos in `assets/img/film/` (about 1600px on the long edge is
# plenty) and edit the list below. The section is hidden when the list is empty.
#   image: file name inside assets/img/film/
#   width: optional relative width in the row of prints (default 1, which suits 4:3;
#          use 1.13 for 3:2 and 1.33 for 16:9 so they hang at the same height). A width of 2 or more marks
#          a panorama or film strip, which fills a row of its own below the prints.
